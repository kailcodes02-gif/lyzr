<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyzr Prototypes — AI Use Case Showcase</title>
  <meta name="description" content="Explore Lyzr's portfolio of AI prototype solutions built for enterprises. Browse by company and industry to find relevant use cases and live demo links." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
</head>
<body>
  <!-- Background layers -->
  <div class="grid-texture" aria-hidden="true"></div>
  <div class="bg-gradient" aria-hidden="true"></div>

  <!-- Header -->
  <header class="site-header" id="site-header">
    <div class="header-inner">
      <div class="brand">
        <img src="logo-white.png" alt="Lyzr" class="brand-logo-img logo-dark" width="32" height="32" />
        <img src="logo.png" alt="Lyzr" class="brand-logo-img logo-light" width="32" height="32" />
        <div class="brand-text">
          <span class="brand-name">Lyzr</span>
          <span class="brand-tag">Prototypes</span>
        </div>
      </div>

      <div class="header-meta">
        <div class="stats-pill" id="stats-pill">
          <span class="stats-dot"></span>
          <span id="stats-text">Loading…</span>
        </div>
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="global-search" class="search-input" placeholder="Search use cases…" autocomplete="off" />
        </div>
        <!-- Theme toggle -->
        <button class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle light/dark mode">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
          </svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- App layout: sidebar + main -->
  <div class="app-layout" id="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <!-- Company categories -->
      <div class="sidebar-section">
        <div class="sidebar-label">Category</div>
        <button class="sidebar-item active" data-company="all" id="tab-all">
          <span class="sidebar-item-label">All</span>
          <span class="sidebar-item-count" id="count-all"></span>
        </button>
        <button class="sidebar-item" data-company="Accenture" id="tab-accenture">
          <span class="sidebar-item-label">Accenture</span>
          <span class="sidebar-item-count" id="count-accenture"></span>
        </button>
        <button class="sidebar-item" data-company="others" id="tab-others">
          <span class="sidebar-item-label">Others</span>
          <span class="sidebar-item-count" id="count-others"></span>
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main-content" id="main-content">
      <!-- Industry / Type bubble bar -->
      <div class="industry-bar" id="industry-bar">
        <div class="industry-bar-inner" id="industry-filters"></div>
      </div>
      <!-- Loading -->
      <div class="loading-state" id="loading-state">
        <div class="loading-dots">
          <div class="dot" style="animation-delay:0ms;"></div>
          <div class="dot" style="animation-delay:200ms;"></div>
          <div class="dot" style="animation-delay:400ms;"></div>
        </div>
        <div class="loading-text">Loading prototypes</div>
      </div>

      <!-- Error state -->
      <div class="error-state hidden" id="error-state">
        <div class="error-icon">⚠️</div>
        <h2>Couldn't load prototypes</h2>
        <p id="error-message">Please try again later.</p>
        <button class="btn-primary" id="btn-retry" onclick="loadData()">Retry</button>
      </div>

      <!-- Empty state -->
      <div class="empty-state hidden" id="empty-state">
        <div class="empty-icon">🔍</div>
        <h2>No prototypes found</h2>
        <p>Try a different search or filter.</p>
      </div>

      <!-- Cards container -->
      <div id="cards-container"></div>
    </main>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-copy">© 2025 Lyzr AI — Prototype Showcase</span>
      <span class="footer-tagline">Last updated · <span id="footer-updated">—</span></span>
    </div>
  </footer>

  <script>
    // ============================================================
    // Theme
    // ============================================================
    const themeToggle = document.getElementById('theme-toggle');
    let currentTheme = localStorage.getItem('proto-theme') || 'dark';
    applyTheme(currentTheme);

    themeToggle.addEventListener('click', () => {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(currentTheme);
      localStorage.setItem('proto-theme', currentTheme);
    });

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
    }

    // ============================================================
    // Config
    // ============================================================
    const DATA_SOURCES = [
      '/api/data',
      'https://raw.githubusercontent.com/kailcodes02-gif/lyzr/main/pipeline/data.json',
    ];

    // Accenture-related company names
    const ACCENTURE_NAMES = ['Accenture', 'Accenture Song'];

    // ============================================================
    // State
    // ============================================================
    let allRows = [];
    let filteredRows = [];
    let activeCategory = 'all'; // 'all' | 'Accenture' | 'others'
    let activeIndustry = null;  // null = show all, string = single industry
    let searchQuery = '';

    // ============================================================
    // Data Loading
    // ============================================================
    async function loadData() {
      showLoading();
      hideError();

      for (const src of DATA_SOURCES) {
        try {
          const res = await fetch(src, { cache: 'no-store' });
          if (!res.ok) continue;
          const json = await res.json();
          if (json.error) continue;

          const rows = Array.isArray(json) ? json : (json.rows || []);

          // Filter: must have prototype_link AND company AND project
          allRows = rows.filter(r =>
            r.prototype_link && r.prototype_link.trim() &&
            r.company && r.company.trim() &&
            r.project && r.project.trim()
          );

          // Normalize industry
          allRows.forEach(r => {
            if (r.industry && r.industry.startsWith('BFSI')) r._industry = 'BFSI';
            else r._industry = r.industry || null;
          });

          if (json.generated_at) {
            const d = new Date(json.generated_at);
            document.getElementById('footer-updated').textContent =
              d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          }

          buildUI();
          return;
        } catch (e) {
          console.warn('Source failed:', src, e);
        }
      }

      showError('Unable to reach any data source. Check your connection.');
    }

    // ============================================================
    // UI Building
    // ============================================================
    function buildUI() {
      hideLoading();
      updateCategoryCounts();
      buildIndustryFilters();
      render();
    }

    function updateCategoryCounts() {
      const accentureCount = allRows.filter(r => ACCENTURE_NAMES.includes(r.company)).length;
      const othersCount = allRows.length - accentureCount;

      document.getElementById('count-all').textContent = allRows.length;
      document.getElementById('count-accenture').textContent = accentureCount;
      document.getElementById('count-others').textContent = othersCount;

      // Stats pill
      const uniqueCompanies = new Set(allRows.map(r => r.company)).size;
      document.getElementById('stats-text').textContent =
        `${allRows.length} prototype${allRows.length !== 1 ? 's' : ''} · ${uniqueCompanies} compan${uniqueCompanies !== 1 ? 'ies' : 'y'}`;

      // Bind category clicks
      document.getElementById('tab-all').onclick = () => setCategory('all');
      document.getElementById('tab-accenture').onclick = () => setCategory('Accenture');
      document.getElementById('tab-others').onclick = () => setCategory('others');
    }

    function buildIndustryFilters() {
      // Get rows scoped to the active category
      const scopedRows = getCategoryRows();

      const industrySet = new Map();
      scopedRows.forEach(r => {
        if (r._industry) {
          industrySet.set(r._industry, (industrySet.get(r._industry) || 0) + 1);
        }
      });

      const sorted = [...industrySet.entries()].sort((a, b) => a[0].localeCompare(b[0]));
      const container = document.getElementById('industry-filters');
      container.innerHTML = '';

      // "All" bubble
      const allBtn = document.createElement('button');
      allBtn.className = 'bubble' + (activeIndustry === null ? ' active' : '');
      allBtn.dataset.industry = 'all';
      allBtn.innerHTML = `All <span class="bubble-count">${scopedRows.length}</span>`;
      allBtn.addEventListener('click', () => setIndustry(null));
      container.appendChild(allBtn);

      sorted.forEach(([industry, count]) => {
        const btn = document.createElement('button');
        btn.className = 'bubble' + (activeIndustry === industry ? ' active' : '');
        btn.dataset.industry = industry;
        btn.innerHTML = `${escHtml(industry)} <span class="bubble-count">${count}</span>`;
        btn.addEventListener('click', () => setIndustry(industry));
        container.appendChild(btn);
      });
    }

    // Returns rows filtered by the active category only
    function getCategoryRows() {
      if (activeCategory === 'Accenture') return allRows.filter(r => ACCENTURE_NAMES.includes(r.company));
      if (activeCategory === 'others') return allRows.filter(r => !ACCENTURE_NAMES.includes(r.company));
      return allRows;
    }

    function setCategory(cat) {
      activeCategory = cat;
      activeIndustry = null; // reset industry when switching category
      document.querySelectorAll('[data-company]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.company === cat);
      });
      buildIndustryFilters(); // rebuild bubbles for this category
      render();
    }

    function setIndustry(industry) {
      activeIndustry = industry;
      document.querySelectorAll('.bubble[data-industry]').forEach(btn => {
        const match = industry === null ? btn.dataset.industry === 'all' : btn.dataset.industry === industry;
        btn.classList.toggle('active', match);
      });
      render();
    }

    function render() {
      const query = searchQuery.toLowerCase().trim();

      filteredRows = allRows.filter(r => {
        // Category filter
        if (activeCategory === 'Accenture' && !ACCENTURE_NAMES.includes(r.company)) return false;
        if (activeCategory === 'others' && ACCENTURE_NAMES.includes(r.company)) return false;

        // Industry filter
        if (activeIndustry && r._industry !== activeIndustry) return false;

        // Search
        if (query) {
          const haystack = [r.project, r.use_case, r.company, r._industry]
            .filter(Boolean).join(' ').toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      });

      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      if (filteredRows.length === 0) {
        document.getElementById('empty-state').classList.remove('hidden');
        return;
      }
      document.getElementById('empty-state').classList.add('hidden');

      // Group by company
      const byCompany = groupBy(filteredRows, 'company');

      Object.entries(byCompany).forEach(([company, rows]) => {
        const section = buildCompanySection(company, rows);
        container.appendChild(section);
      });

      // Animate
      requestAnimationFrame(() => {
        document.querySelectorAll('.proto-card').forEach((card, i) => {
          card.style.animationDelay = `${Math.min(i * 35, 600)}ms`;
          card.classList.add('animate-in');
        });
      });
    }

    function buildCompanySection(company, rows) {
      const section = document.createElement('section');
      section.className = 'company-section';
      section.id = 'section-' + slugify(company);

      const header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML = `
        <div class="section-title-row">
          <div class="company-avatar">${getInitials(company)}</div>
          <div>
            <h2 class="section-company-name">${escHtml(company)}</h2>
            <span class="section-count">${rows.length} prototype${rows.length !== 1 ? 's' : ''}</span>
          </div>
        </div>
      `;
      section.appendChild(header);

      const grid = document.createElement('div');
      grid.className = 'proto-grid';
      rows.forEach(row => grid.appendChild(buildCard(row)));
      section.appendChild(grid);
      return section;
    }

    function buildCard(row) {
      const rawLink = row.prototype_link || '';
      const firstLink = rawLink.split(/\s+/).find(s => s.startsWith('http')) || rawLink;
      const useCase = getUseCase(row);
      const industryLabel = row._industry;

      const card = document.createElement('article');
      card.className = 'proto-card';
      card.innerHTML = `
        <div class="card-body">
          <div class="card-top">
            ${industryLabel ? `<span class="pill-quiet">${escHtml(industryLabel)}</span>` : ''}
            <h3 class="card-title">${escHtml(row.project)}</h3>
            ${useCase ? `<p class="card-usecase">${escHtml(useCase)}</p>` : '<p class="card-usecase card-usecase-empty">No description available</p>'}
          </div>
          <div class="card-bottom">
            <a href="${escAttr(firstLink)}" target="_blank" rel="noopener noreferrer" class="btn-demo" id="proto-link-${escAttr(row.id || slugify(row.project))}">
              <span>Open Demo</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </a>
            <div class="card-url" title="${escAttr(firstLink)}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              <span>${truncateUrl(firstLink)}</span>
            </div>
          </div>
        </div>
      `;
      return card;
    }

    // ============================================================
    // Helpers
    // ============================================================
    function getUseCase(row) {
      const uc = row.use_case;
      if (!uc) return null;
      if (/^https?:\/\//i.test(uc.trim())) return null;
      if (/^PRJ\s/i.test(uc.trim())) return null;
      if (uc.trim().toLowerCase() === row.project?.trim().toLowerCase()) return null;
      return uc;
    }

    function groupBy(arr, key) {
      return arr.reduce((acc, item) => {
        const k = item[key] || 'Other';
        if (!acc[k]) acc[k] = [];
        acc[k].push(item);
        return acc;
      }, {});
    }

    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escAttr(str) {
      if (!str) return '';
      return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function slugify(str) {
      return String(str || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    function getInitials(name) {
      return (name || '?').split(/\s+/).slice(0, 2).map(w => w[0]?.toUpperCase() || '').join('');
    }

    function truncateUrl(url) {
      try { return new URL(url).hostname.replace(/^www\./, ''); }
      catch { return url.length > 40 ? url.slice(0, 40) + '…' : url; }
    }

    // ============================================================
    // Search
    // ============================================================
    const searchInput = document.getElementById('global-search');
    let searchDebounce;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => { searchQuery = searchInput.value; render(); }, 220);
    });

    // ============================================================
    // Loading / Error
    // ============================================================
    function showLoading() { document.getElementById('loading-state').classList.remove('hidden'); document.getElementById('cards-container').innerHTML = ''; }
    function hideLoading() { document.getElementById('loading-state').classList.add('hidden'); }
    function showError(msg) { hideLoading(); document.getElementById('error-message').textContent = msg; document.getElementById('error-state').classList.remove('hidden'); }
    function hideError() { document.getElementById('error-state').classList.add('hidden'); }

    // ============================================================
    // Boot
    // ============================================================
    loadData();
  </script>
</body>
</html>
