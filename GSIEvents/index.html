<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>GSI &amp; SI Event Intelligence — Lyzr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --surface:#FAF6F0; --card:#FFFFFF; --ink:#1E1A16; --muted:#6B6257; --border:#E4DCCF; --hover:#FBF7EE;
  --open:#177245; --invite:#E0823F; --internal:#A23A6B; --attend:#4053C2; --su:#B98900;
  --open-t:rgba(23,114,69,.10); --invite-t:rgba(224,130,63,.13); --internal-t:rgba(162,58,107,.10);
  --attend-t:rgba(64,83,194,.09); --su-t:rgba(185,137,0,.12);
  --up:#177245; --up-t:rgba(23,114,69,.12); --fin:#8A8072; --fin-t:rgba(138,128,114,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.45}
a{color:inherit}
h1{font-family:'Playfair Display',serif;font-weight:500;font-size:26px;letter-spacing:.2px}
h2{font-family:'Playfair Display',serif;font-weight:500;font-size:19px}
.hidden{display:none !important}
/* header */
header.top{position:sticky;top:0;z-index:40;background:rgba(250,246,240,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand .b1{font-family:'Playfair Display',serif;font-size:20px}
.brand .b2{font-size:11px;color:var(--muted);letter-spacing:.4px}
.grow{flex:1}
.search{position:relative}
.search input{font-family:'DM Sans';font-size:13px;padding:9px 12px 9px 32px;border:1px solid var(--border);border-radius:9px;background:var(--card);width:240px;color:var(--ink)}
.search svg{position:absolute;left:10px;top:9px;color:var(--muted)}
.btn{font-family:'DM Sans';font-size:13px;font-weight:600;padding:9px 14px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.accent{background:var(--invite);color:#fff;border-color:var(--invite)}
.userbox{display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--attend);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.uname{font-size:12.5px}.urole{font-size:10.5px;color:var(--muted)}
/* layout */
.wrap{max-width:1320px;margin:0 auto;padding:20px 22px 80px}
.sub{color:var(--muted);max-width:920px;margin-top:2px;font-size:12.5px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}
.tile{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 14px}
.tile .n{font-family:'Playfair Display',serif;font-size:27px;line-height:1.05}
.tile .l{color:var(--muted);font-size:11.5px;margin-top:3px}
.tile .dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:1px}
/* chart */
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.panel h2{font-size:16px;margin-bottom:2px}
.panel .note{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.bars{display:flex;align-items:flex-end;gap:8px;height:118px}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer}
.barcol .v{font-size:11px;margin-bottom:3px}
.bar{width:100%;max-width:46px;background:var(--invite);border-radius:4px 4px 0 0;transition:opacity .12s;min-height:3px}
.bar.past{background:var(--fin)}.bar.soon{background:var(--up)}.bar.future{background:var(--attend)}
.barcol:hover .bar{opacity:.72}
.barcol.sel .bar{outline:2px solid var(--ink);outline-offset:1px}
.barlab{font-size:10px;color:var(--muted);margin-top:6px;text-align:center;line-height:1.15}
.baseline{border-top:1.5px solid var(--border);margin-top:2px}
/* controls */
.controls{position:sticky;top:59px;z-index:30;background:var(--surface);padding:10px 0 8px;margin-bottom:6px;border-bottom:1px solid var(--border)}
.rowc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{font-family:'DM Sans';font-size:12.5px;font-weight:600;padding:7px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.gbLabel{font-size:12px;color:var(--muted);font-weight:600;margin-right:2px}
select,.chk{font-family:'DM Sans';font-size:12.5px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink)}
label.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.count{font-size:12px;color:var(--muted);margin-left:auto}
.clearf{font-size:12px;color:var(--invite);cursor:pointer;font-weight:600;border:0;background:none}
/* sections */
.section{margin-top:16px}
.shead{display:flex;align-items:center;gap:9px;cursor:pointer;padding:7px 4px;border-bottom:1px solid var(--border)}
.shead .caret{color:var(--muted);transition:transform .15s}
.section.closed .caret{transform:rotate(-90deg)}
.section.closed .grid{display:none}
.shead .stitle{font-family:'Playfair Display',serif;font-size:17px}
.shead .scount{font-size:11.5px;color:var(--muted);background:var(--hover);border:1px solid var(--border);border-radius:20px;padding:1px 9px}
.shead .sacc{width:26px;height:26px;border-radius:7px;background:var(--attend-t);color:var(--attend);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:11px;margin-top:11px}
/* cards */
.ev{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 14px;display:flex;flex-direction:column;gap:8px;position:relative}
.ev .co{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.ev .ti{font-weight:700;font-size:14px;line-height:1.3;padding-right:26px}
.ev .ti a{text-decoration:none;border-bottom:1px solid #C9BFAE}
.ev .ti a:hover{border-color:var(--ink)}
.ev .meta{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.c-open{background:var(--open-t);color:var(--open)}.c-invite{background:var(--invite-t);color:#b4632a}
.c-internal{background:var(--internal-t);color:var(--internal)}.c-attend{background:var(--attend-t);color:var(--attend)}
.c-su{background:var(--su-t);color:#916a00}
.d-open{background:var(--open)}.d-invite{background:var(--invite)}.d-internal{background:var(--internal)}.d-attend{background:var(--attend)}.d-su{background:var(--su)}
.badge{font-size:10px;padding:1px 7px;border-radius:9px;border:1px solid var(--border);color:var(--muted)}
.badge.hi{border-color:#9DBFAE;color:#177245}.badge.lo{border-color:#E3C9A8;color:#A05E12}
.pill{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px}
.pill.up{background:var(--up-t);color:var(--up)}.pill.fin{background:var(--fin-t);color:#6d6459}
.part{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid}
.part.going{background:rgba(23,114,69,.12);color:var(--open);border-color:#9DBFAE}
.part.attending{background:var(--attend-t);color:var(--attend);border-color:#B7C0EA}
.part.sponsoring{background:var(--su-t);color:#916a00;border-color:#E3C9A8}
.part.not_going{background:rgba(162,58,107,.08);color:var(--internal);border-color:#D9B6C7}
.part.revisit_next_year{background:var(--fin-t);color:#6d6459;border-color:#C9BFAE;border-style:dashed}
.assignrow{display:flex;align-items:center;gap:8px;border-top:1px dashed var(--border);padding-top:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.owners{display:flex;gap:-6px}
.oav{width:22px;height:22px;border-radius:50%;background:var(--internal);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--card);margin-left:-6px}
.oav:first-child{margin-left:0}
.ev .editbtn{position:absolute;top:11px;right:11px;width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.ev .editbtn:hover{background:var(--hover);color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:50px 0}
/* auth gate */
.gate{position:fixed;inset:0;z-index:100;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:20px}
.gatecard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:38px 34px;max-width:410px;text-align:center;box-shadow:0 20px 50px rgba(30,26,22,.08)}
.gatecard .glogo{width:46px;height:46px;border-radius:12px;background:var(--ink);color:#fff;font-family:'Playfair Display',serif;font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.gatecard h1{font-size:23px;margin-bottom:8px}
.gatecard p{color:var(--muted);font-size:13px;margin-bottom:22px}
.gatecard em{font-style:normal;color:var(--invite)}
.gbtn{display:inline-flex;align-items:center;gap:10px;padding:11px 20px;border:1px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-weight:600;font-size:14px}
.gbtn:hover{background:var(--hover)}
/* modal */
.backdrop{position:fixed;inset:0;z-index:90;background:rgba(30,26,22,.42);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--card);border-radius:15px;width:min(620px,96vw);max-height:92vh;overflow:auto;border:1px solid var(--border)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card)}
.mhead h2{font-size:18px}
.mx{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.mbody{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:4px}.fg.full{grid-column:1/-1}
.fg label{font-size:11.5px;font-weight:600;color:var(--muted)}
.fg input,.fg select,.fg textarea{font-family:'DM Sans';font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink)}
.fg textarea{min-height:58px;resize:vertical}
.mfoot{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card)}
.hint{font-size:11px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;z-index:120;box-shadow:0 8px 24px rgba(0,0,0,.2)}
footer{max-width:1320px;margin:30px auto 0;padding:16px 22px;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}
@media(max-width:640px){.mbody{grid-template-columns:1fr}.search input{width:150px}}
</style>
</head>
<body>

<!-- AUTH GATE -->
<div class="gate" id="gate">
  <div class="gatecard">
    <div class="glogo">L</div>
    <h1>GSI &amp; SI Event Intelligence</h1>
    <p>Sign in with your <em>@lyzr.ai</em> Google account to view the tracker.</p>
    <button class="gbtn" id="gbtn">
      <svg width="18" height="18" viewBox="0 0 18 18"><g fill="none" fill-rule="evenodd"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></g></svg>
      Continue with Google
    </button>
    <p style="margin-top:16px;font-size:11px" id="gerr"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="top">
    <div class="brand"><span class="b1">Event Intelligence</span><span class="b2">30 GSIs &amp; consulting firms · H2 2026 →</span></div>
    <div class="grow"></div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="q" type="text" placeholder="Search events, cities, evidence…" autocomplete="off">
    </div>
    <button class="btn accent hidden" id="addBtn">+ Add event</button>
    <div class="userbox">
      <div class="avatar" id="uav">?</div>
      <div><div class="uname" id="uname"></div><div class="urole" id="urole"></div></div>
      <button class="btn" id="signout" title="Sign out" style="padding:7px 9px">↩</button>
    </div>
  </header>

  <div class="wrap">
    <div class="tiles" id="tiles"></div>

    <div class="panel">
      <h2>When it happens</h2>
      <div class="note">events per month · <span style="color:var(--fin)">grey = finished</span> · <span style="color:var(--up)">green = upcoming (≤60d)</span> · <span style="color:var(--attend)">indigo = later</span> · click a bar to filter</div>
      <div class="bars" id="bars"></div>
      <div class="baseline"></div>
      <div style="display:flex;gap:8px" id="barlabs"></div>
    </div>

    <div class="controls">
      <div class="rowc" style="margin-bottom:8px">
        <span class="gbLabel">Group by</span>
        <div class="seg" id="groupSeg">
          <button data-g="company" class="on">Account</button>
          <button data-g="category">Category</button>
          <button data-g="event_type">Type</button>
          <button data-g="status">Status</button>
          <button data-g="month">Month</button>
          <button data-g="region">Region</button>
        </div>
        <span class="count" id="count"></span>
      </div>
      <div class="rowc">
        <select id="fCat"><option value="">All categories</option>
          <option value="hosted_open">Hosted · open</option><option value="hosted_invite_only">Hosted · invite-only</option>
          <option value="hosted_internal">Hosted · internal</option><option value="attending">Attending / sponsoring</option></select>
        <select id="fCo"><option value="">All accounts</option></select>
        <select id="fType"><option value="">All types</option></select>
        <select id="fReg"><option value="">All regions</option></select>
        <select id="fStatus"><option value="">Any status</option><option value="upcoming">Upcoming (≤60d)</option><option value="finished">Finished</option><option value="untagged">Untagged (later/TBC)</option></select>
        <select id="fPart"><option value="">Any participation</option><option value="going">Going</option><option value="attending">Attending</option><option value="sponsoring">Sponsoring</option><option value="not_going">Not going</option><option value="revisit_next_year">Check next year</option><option value="__set">Assigned (any)</option><option value="__none">Unassigned</option></select>
        <label class="chk"><input type="checkbox" id="fSu"> Startup-friendly</label>
        <label class="chk"><input type="checkbox" id="fMine"> My events</label>
        <button class="clearf" id="clearf">Clear</button>
      </div>
    </div>

    <div id="content"></div>
  </div>
  <footer id="foot"></footer>
</div>

<!-- EDIT / ADD MODAL -->
<div class="backdrop hidden" id="modal">
  <div class="modal">
    <div class="mhead"><h2 id="mtitle">Edit event</h2><button class="mx" id="mclose">×</button></div>
    <div class="mbody" id="mbody">
      <div class="fg full"><label>Event name *</label><input id="f_event_name" required></div>
      <div class="fg"><label>Account / company *</label><input id="f_company" list="colist" required></div>
      <div class="fg"><label>Category *</label><select id="f_category">
        <option value="hosted_open">Hosted · open</option><option value="hosted_invite_only">Hosted · invite-only</option>
        <option value="hosted_internal">Hosted · internal</option><option value="attending">Attending / sponsoring</option></select></div>
      <div class="fg"><label>Event type</label><input id="f_event_type" placeholder="conference, summit, webinar…"></div>
      <div class="fg"><label>Role</label><input id="f_role" placeholder="host, sponsor, speaker…"></div>
      <div class="fg"><label>Date (display)</label><input id="f_date" placeholder="Sep 10, 2026"></div>
      <div class="fg"><label>Start date (for status)</label><input id="f_start_iso" type="date"></div>
      <div class="fg"><label>City</label><input id="f_city"></div>
      <div class="fg"><label>Country</label><input id="f_country"></div>
      <div class="fg"><label>Region</label><select id="f_region">
        <option value="">—</option><option>US</option><option>UK</option><option>Europe</option><option>India</option><option>APAC</option><option>Middle East</option><option>Virtual</option><option>Global</option></select></div>
      <div class="fg"><label>Format</label><select id="f_format"><option value="">—</option><option>in-person</option><option>virtual</option><option>hybrid</option></select></div>
      <div class="fg"><label>Registration</label><select id="f_registration"><option value="">—</option><option>open</option><option>invite_only</option><option>paid_ticket</option><option>internal</option><option>unknown</option></select></div>
      <div class="fg"><label>Confidence</label><select id="f_confidence"><option>high</option><option selected>medium</option><option>low</option></select></div>
      <div class="fg"><label>Startup-friendly</label><select id="f_startup_friendly"><option value="false">No</option><option value="true">Yes</option></select></div>
      <div class="fg full"><label>Source URL</label><input id="f_url" placeholder="https://…"></div>
      <div class="fg full"><label>Evidence / notes</label><textarea id="f_evidence"></textarea></div>
      <div class="fg full" style="border-top:1px solid var(--border);padding-top:10px"><label style="color:var(--invite)">Lyzr participation — are we going?</label>
        <select id="f_participation"><option value="">Undecided</option><option value="going">Going</option><option value="attending">Attending</option><option value="sponsoring">Sponsoring</option><option value="not_going">Not going</option><option value="revisit_next_year">Check next year</option></select></div>
      <div class="fg"><label>Owner(s) — emails</label><input id="f_owner" placeholder="ani@lyzr.ai, ankita@lyzr.ai"></div>
      <div class="fg"><label>Attendees — emails</label><input id="f_attendees" placeholder="comma / space separated"></div>
    </div>
    <div class="mfoot"><span class="hint" id="mhint"></span><button class="btn" id="mcancel">Cancel</button><button class="btn primary" id="msave">Save</button></div>
  </div>
</div>
<datalist id="colist"></datalist>

<script>
/* ============ config ============ */
const LYZR_OAUTH_CLIENT_ID = '393767244875-e2n5j0jr90g0a8asp4ti9akmlern6enb.apps.googleusercontent.com';
const EDITOR_EMAILS = ['subs@lyzr.ai','kailash.gm@lyzr.ai','ani@lyzr.ai','ankita@lyzr.ai','anju@lyzr.ai','kailcodes02@gmail.com'];
const CAT = {
  hosted_open:{lab:'Hosted · open',cls:'c-open',dot:'d-open'},
  hosted_invite_only:{lab:'Hosted · invite-only',cls:'c-invite',dot:'d-invite'},
  hosted_internal:{lab:'Hosted · internal',cls:'c-internal',dot:'d-internal'},
  attending:{lab:'Attending / sponsoring',cls:'c-attend',dot:'d-attend'}
};
const PARTLAB={going:'Going',attending:'Attending',sponsoring:'Sponsoring',not_going:'Not going',revisit_next_year:'Check next year'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ state ============ */
let USER=null, TOKEN=null, isEditor=false;
let ALL=[], gen='—';
let groupBy='company';
const F={q:'',cat:'',co:'',type:'',reg:'',status:'',part:'',su:false,mine:false,month:''};

/* ============ auth ============ */
const $=id=>document.getElementById(id);
$('gbtn').onclick=signIn;
function signIn(){
  if(!(window.google&&google.accounts&&google.accounts.oauth2)){$('gerr').textContent='Google still loading — try again.';return;}
  const client=google.accounts.oauth2.initTokenClient({
    client_id:LYZR_OAUTH_CLIENT_ID, scope:'email profile', hd:'lyzr.ai',
    callback:async r=>{
      if(r.error){$('gerr').textContent='Sign-in failed.';return;}
      try{
        const p=await(await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+r.access_token}})).json();
        const email=(p.email||'').toLowerCase();
        const ok=(p.email_verified===true||p.email_verified==='true')&&(email.endsWith('@lyzr.ai')||p.hd==='lyzr.ai'||email==='kailcodes02@gmail.com');
        if(!ok){$('gerr').textContent='Access restricted to @lyzr.ai accounts. You used '+(p.email||'?');return;}
        USER={name:p.name,email,picture:p.picture}; TOKEN=r.access_token;
        isEditor=EDITOR_EMAILS.includes(email);
        sessionStorage.setItem('gsi.u',JSON.stringify(USER));sessionStorage.setItem('gsi.t',TOKEN);
        enter();
      }catch(e){$('gerr').textContent='Sign-in error.';}
    }
  });
  client.requestAccessToken();
}
function restore(){
  const u=sessionStorage.getItem('gsi.u'),t=sessionStorage.getItem('gsi.t');
  if(u&&t){try{USER=JSON.parse(u);TOKEN=t;isEditor=EDITOR_EMAILS.includes(USER.email);enter();return true;}catch(e){}}
  return false;
}
$('signout').onclick=()=>{sessionStorage.removeItem('gsi.u');sessionStorage.removeItem('gsi.t');location.reload();};
function enter(){
  $('gate').classList.add('hidden');$('app').classList.remove('hidden');
  $('uname').textContent=USER.name||USER.email;
  $('urole').textContent=isEditor?'Editor':'Viewer';
  const av=$('uav');
  if(USER.picture)av.innerHTML='<img src="'+esc(USER.picture)+'">';else av.textContent=(USER.name||USER.email||'?')[0].toUpperCase();
  if(isEditor)$('addBtn').classList.remove('hidden');
  loadData();
}

/* ============ data ============ */
async function loadData(){
  let data=null;
  try{
    const res=await fetch('/api/events',{cache:'no-store',headers:TOKEN?{Authorization:'Bearer '+TOKEN}:{}});
    if(res.ok){const j=await res.json();if(!j.error)data=j;}
  }catch(e){}
  if(!data){try{data=await(await fetch('./events.json',{cache:'no-store'})).json();}catch(e){}}
  if(!data){$('content').innerHTML='<div class="empty">Could not load events.json</div>';return;}
  ALL=(data.events||[]).map(normalize);
  gen=data.compiled_date||data.generated_at||'—';
  buildFilters();buildTiles();buildChart();render();buildFooter();
}
function normalize(e){
  e.owner=e.owner||[];e.attendees=e.attendees||[];e.participation=e.participation||'';
  e._status=computeStatus(e);return e;
}
function computeStatus(e){
  const s=e.start_iso?new Date(e.start_iso+'T00:00:00'):null;
  const en=e.end_iso?new Date(e.end_iso+'T00:00:00'):s;
  if(!s)return e.status||'';           // unknown date → keep stored (usually untagged)
  const now=new Date();now.setHours(0,0,0,0);
  const win=new Date(now);win.setDate(win.getDate()+60);
  if(en&&en<now)return 'finished';
  if(s<=win)return 'upcoming';
  return '';
}
const MONTHKEY=e=>{if(e.start_iso)return e.start_iso.slice(0,7);return '9999-99';};
const MONTHLAB=k=>{if(k==='9999-99')return 'TBC';const[y,m]=k.split('-');return new Date(y,m-1,1).toLocaleString('en',{month:'short'})+" '"+y.slice(2);};

/* ============ filters ============ */
function buildFilters(){
  const cos=[...new Set(ALL.map(e=>e.company))].sort();
  $('fCo').innerHTML='<option value="">All accounts</option>'+cos.map(c=>`<option>${esc(c)}</option>`).join('');
  $('colist').innerHTML=cos.map(c=>`<option value="${esc(c)}">`).join('');
  const types=[...new Set(ALL.map(e=>e.event_type).filter(Boolean))].sort();
  $('fType').innerHTML='<option value="">All types</option>'+types.map(t=>`<option>${esc(t)}</option>`).join('');
  const regs=[...new Set(ALL.map(e=>e.region).filter(Boolean))].sort();
  $('fReg').innerHTML='<option value="">All regions</option>'+regs.map(r=>`<option>${esc(r)}</option>`).join('');
}
function bindControls(){
  $('q').addEventListener('input',()=>{F.q=$('q').value.toLowerCase();render();});
  const map={fCat:'cat',fCo:'co',fType:'type',fReg:'reg',fStatus:'status',fPart:'part'};
  for(const id in map)$(id).addEventListener('change',()=>{F[map[id]]=$(id).value;render();});
  $('fSu').addEventListener('change',()=>{F.su=$('fSu').checked;render();});
  $('fMine').addEventListener('change',()=>{F.mine=$('fMine').checked;render();});
  $('clearf').onclick=()=>{Object.assign(F,{q:'',cat:'',co:'',type:'',reg:'',status:'',part:'',su:false,mine:false,month:''});
    ['q','fCat','fCo','fType','fReg','fStatus','fPart'].forEach(i=>$(i).value='');$('fSu').checked=false;$('fMine').checked=false;
    document.querySelectorAll('.barcol').forEach(b=>b.classList.remove('sel'));render();};
  document.querySelectorAll('#groupSeg button').forEach(b=>b.onclick=()=>{
    groupBy=b.dataset.g;document.querySelectorAll('#groupSeg button').forEach(x=>x.classList.toggle('on',x===b));render();});
  $('addBtn').onclick=openAdd;
  $('mclose').onclick=$('mcancel').onclick=closeModal;
  $('msave').onclick=saveModal;
}

/* ============ filtering ============ */
function filtered(){
  const me=USER?USER.email:'';
  return ALL.filter(e=>{
    if(F.q){const h=(e.event_name+' '+e.company+' '+e.city+' '+e.country+' '+e.evidence).toLowerCase();if(!h.includes(F.q))return false;}
    if(F.cat&&e.category!==F.cat)return false;
    if(F.co&&e.company!==F.co)return false;
    if(F.type&&e.event_type!==F.type)return false;
    if(F.reg&&e.region!==F.reg)return false;
    if(F.su&&!e.startup_friendly)return false;
    if(F.month&&MONTHKEY(e)!==F.month)return false;
    if(F.status){const s=e._status||'untagged';if(F.status==='untagged'){if(e._status)return false;}else if(s!==F.status)return false;}
    if(F.part){
      if(F.part==='__set'&&!e.participation)return false;
      if(F.part==='__none'&&e.participation)return false;
      if(F.part!=='__set'&&F.part!=='__none'&&e.participation!==F.part)return false;
    }
    if(F.mine&&!(e.owner.includes(me)||e.attendees.includes(me)))return false;
    return true;
  });
}

/* ============ tiles / chart ============ */
function buildTiles(){
  const n=c=>ALL.filter(e=>e.category===c).length;
  const t=[
    ['n',new Set(ALL.map(e=>e.company)).size,'accounts',''],
    ['n',ALL.length,'events tracked',''],
    ['n',ALL.filter(e=>e._status==='upcoming').length,'upcoming ≤60d','d-open'],
    ['n',ALL.filter(e=>e._status==='finished').length,'finished','d-internal'],
    ['n',ALL.filter(e=>e.startup_friendly).length,'startup doors','d-su'],
    ['n',n('hosted_open')+n('hosted_invite_only')+n('hosted_internal'),'they host','d-invite'],
    ['n',n('attending'),'attending','d-attend'],
  ];
  $('tiles').innerHTML=t.map(x=>`<div class="tile"><div class="n">${x[1]}</div><div class="l">${x[3]?`<span class="dot ${x[3]}"></span>`:''}${x[2]}</div></div>`).join('');
}
function buildChart(){
  const keys=[...new Set(ALL.map(MONTHKEY))].sort();
  const cnt={};ALL.forEach(e=>{const k=MONTHKEY(e);cnt[k]=(cnt[k]||0)+1;});
  const mx=Math.max(1,...keys.map(k=>cnt[k]||0));
  const now=new Date();const nowk=now.toISOString().slice(0,7);
  const win=new Date();win.setDate(win.getDate()+60);const wk=win.toISOString().slice(0,7);
  $('bars').innerHTML=keys.map(k=>{
    const v=cnt[k]||0;let cls='future';if(k==='9999-99')cls='future';else if(k<nowk)cls='past';else if(k<=wk)cls='soon';
    return `<div class="barcol" data-k="${k}" title="${MONTHLAB(k)} · ${v}"><div class="v">${v}</div><div class="bar ${cls}" style="height:${Math.max(v/mx*92,3)}px"></div></div>`;
  }).join('');
  $('barlabs').innerHTML=keys.map(k=>`<div class="barlab" style="flex:1">${MONTHLAB(k)}</div>`).join('');
  document.querySelectorAll('.barcol').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;F.month=(F.month===k)?'':k;
    document.querySelectorAll('.barcol').forEach(x=>x.classList.toggle('sel',x.dataset.k===F.month&&F.month));render();});
}

/* ============ render ============ */
function groupVal(e){
  if(groupBy==='category')return CAT[e.category].lab;
  if(groupBy==='status')return e._status==='upcoming'?'Upcoming (≤60 days)':e._status==='finished'?'Finished':'Untagged (later / TBC)';
  if(groupBy==='month')return MONTHLAB(MONTHKEY(e));
  if(groupBy==='event_type')return e.event_type||'—';
  if(groupBy==='region')return e.region||'—';
  return e.company;
}
function sortKeyForMonth(lab){const e=ALL.find(x=>MONTHLAB(MONTHKEY(x))===lab);return e?MONTHKEY(e):'zz';}
function render(){
  const rows=filtered();
  $('count').textContent=rows.length+' of '+ALL.length+' events';
  const groups={};rows.forEach(e=>{(groups[groupVal(e)]=groups[groupVal(e)]||[]).push(e);});
  let names=Object.keys(groups);
  if(groupBy==='month')names.sort((a,b)=>sortKeyForMonth(a).localeCompare(sortKeyForMonth(b)));
  else if(groupBy==='status')names.sort((a,b)=>({'Upcoming (≤60 days)':0,'Finished':1,'Untagged (later / TBC)':2}[a]-{'Upcoming (≤60 days)':0,'Finished':1,'Untagged (later / TBC)':2}[b]));
  else names.sort((a,b)=>groups[b].length-groups[a].length||a.localeCompare(b));
  const c=$('content');
  if(!rows.length){c.innerHTML='<div class="empty">No events match these filters.</div>';return;}
  c.innerHTML=names.map(nm=>{
    const list=groups[nm].slice().sort(byDate);
    const acc=groupBy==='company'?`<span class="sacc">${initials(nm)}</span>`:'';
    return `<div class="section"><div class="shead" onclick="this.parentElement.classList.toggle('closed')">
      <svg class="caret" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
      ${acc}<span class="stitle">${esc(nm)}</span><span class="scount">${list.length}</span></div>
      <div class="grid">${list.map(card).join('')}</div></div>`;
  }).join('');
}
function byDate(a,b){const x=a.start_iso||'9999',y=b.start_iso||'9999';return x.localeCompare(y);}
function initials(n){return (n||'?').replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();}
function card(e){
  const c=CAT[e.category];
  const st=e._status==='upcoming'?'<span class="pill up">Upcoming</span>':e._status==='finished'?'<span class="pill fin">Finished</span>':'';
  const su=e.startup_friendly?`<span class="chip c-su"><span class="dot d-su"></span>startup</span>`:'';
  const part=e.participation?`<span class="part ${e.participation}">${PARTLAB[e.participation]}</span>`:'';
  const conf=e.confidence?`<span class="badge ${e.confidence==='high'?'hi':e.confidence==='low'?'lo':''}">${esc(e.confidence)}</span>`:'';
  const loc=[e.city,e.country].filter(Boolean).join(', ')||e.region||'—';
  const owners=e.owner.length?`<div class="owners">${e.owner.slice(0,4).map(o=>`<div class="oav" title="${esc(o)}">${esc(o[0].toUpperCase())}</div>`).join('')}</div><span>${e.owner.length} owner${e.owner.length>1?'s':''}</span>`:'<span>No owner</span>';
  const att=e.attendees.length?` · ${e.attendees.length} attending`:'';
  const editBtn=isEditor?`<button class="editbtn" title="Edit / assign" onclick="openEdit('${e.id}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>`:'';
  return `<div class="ev">${editBtn}
    <div class="co">${esc(e.company)}</div>
    <div class="ti">${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.event_name)}</a>`:esc(e.event_name)}</div>
    <div class="chips"><span class="chip ${c.cls}"><span class="dot ${c.dot}"></span>${c.lab}</span>${su}${st}${part}</div>
    <div class="meta">${esc(e.date)} · ${esc(loc)} · ${esc((e.event_type||'').replace(/_/g,' '))} ${conf}</div>
    <div class="assignrow">${owners}${att}${part?'':(isEditor?' · <span style="color:var(--invite)">assign ›</span>':'')}</div>
  </div>`;
}
function buildFooter(){
  $('foot').innerHTML=`<b>How to read.</b> Categories: <i>Hosted·open</i> = account organizes, anyone can register; <i>invite-only</i> = gated CXO/roundtable/awards; <i>internal</i> = employee-facing; <i>Attending/sponsoring</i> = a third party organizes and the account participates. Status is computed live: <b>Finished</b> = already over · <b>Upcoming</b> = within 60 days · events further out or undated stay untagged. Owners, attendees &amp; Lyzr participation are set by editors (Kailash, Anirudh, Ankita, Anju). Compiled ${esc(gen)}. ${ALL.length} events across ${new Set(ALL.map(e=>e.company)).size} accounts.`;
}

/* ============ modal (add/edit/assign) ============ */
let editId=null;
const FF=['event_name','company','category','event_type','role','date','start_iso','city','country','region','format','registration','confidence','startup_friendly','url','evidence','participation','owner','attendees'];
function openAdd(){editId=null;$('mtitle').textContent='Add event';FF.forEach(f=>setF(f,''));
  setF('category','attending');setF('confidence','medium');setF('startup_friendly','false');
  $('mhint').textContent='New event committed to the shared tracker.';$('modal').classList.remove('hidden');}
window.openEdit=function(id){editId=id;const e=ALL.find(x=>x.id===id);if(!e)return;
  $('mtitle').textContent='Edit / assign — '+e.event_name.slice(0,40);
  setF('event_name',e.event_name);setF('company',e.company);setF('category',e.category);
  setF('event_type',e.event_type);setF('role',e.role);setF('date',e.date);setF('start_iso',e.start_iso||'');
  setF('city',e.city);setF('country',e.country);setF('region',e.region);setF('format',e.format);
  setF('registration',e.registration);setF('confidence',e.confidence||'medium');
  setF('startup_friendly',e.startup_friendly?'true':'false');setF('url',e.url);setF('evidence',e.evidence);
  setF('participation',e.participation||'');setF('owner',(e.owner||[]).join(', '));setF('attendees',(e.attendees||[]).join(', '));
  $('mhint').textContent='ID '+e.id;$('modal').classList.remove('hidden');};
function setF(f,v){const el=$('f_'+f);if(el)el.value=v;}
function getF(f){const el=$('f_'+f);return el?el.value.trim():'';}
function closeModal(){$('modal').classList.add('hidden');}
async function saveModal(){
  const name=getF('event_name'),co=getF('company');
  if(!name||!co){toast('Event name & account required');return;}
  const payload={
    event_name:name,company:co,category:getF('category'),event_type:getF('event_type'),role:getF('role'),
    date:getF('date'),start_iso:getF('start_iso')||null,end_iso:getF('start_iso')||null,city:getF('city'),country:getF('country'),
    region:getF('region'),format:getF('format'),registration:getF('registration'),confidence:getF('confidence'),
    startup_friendly:getF('startup_friendly')==='true',url:getF('url'),evidence:getF('evidence'),
    participation:getF('participation'),owner:getF('owner'),attendees:getF('attendees')
  };
  const btn=$('msave');btn.disabled=true;btn.textContent='Saving…';
  try{
    const url=editId?('/api/events?id='+encodeURIComponent(editId)):'/api/events';
    const res=await fetch(url,{method:editId?'PUT':'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify(payload)});
    const j=await res.json();
    if(!res.ok)throw new Error(j.error||('HTTP '+res.status));
    closeModal();toast(editId?'Saved':'Event added');await loadData();
  }catch(e){toast('Save failed: '+e.message);}
  finally{btn.disabled=false;btn.textContent='Save';}
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}

/* ============ boot ============ */
bindControls();
if(!restore()){/* show gate (default) */}
</script>
