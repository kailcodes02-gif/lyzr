<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks — Work OS</title>
  <meta name="description" content="Weekly task tracking from meetings — Work OS by Kailash." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center gap-3">
      <a href="/" id="back-link" aria-label="Back to home"
         class="text-gray-400 hover:text-indigo-600 transition-colors duration-150">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </a>
      <h1 class="text-lg font-semibold text-gray-900">Tasks</h1>
    </div>
  </header>

  <!-- Week list -->
  <main class="max-w-3xl mx-auto px-4 py-8" id="main-content">

    <!-- Skeleton / loading state -->
    <div id="loading-state" class="flex flex-col gap-4">
      <div class="h-28 bg-gray-100 rounded-xl animate-pulse"></div>
      <div class="h-28 bg-gray-100 rounded-xl animate-pulse"></div>
      <div class="h-28 bg-gray-100 rounded-xl animate-pulse"></div>
    </div>

    <!-- Empty state (hidden by default) -->
    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-24 gap-3">
      <span class="text-5xl" aria-hidden="true">📋</span>
      <p class="text-gray-400 text-sm text-center">No weeks yet. Your first meeting will appear here.</p>
    </div>

    <!-- Week cards container (hidden until data loads) -->
    <div id="weeks-container" class="hidden flex flex-col gap-4"></div>

  </main>

  <script>
    (function () {

      function statusBadge(status) {
        if (status === 'complete') {
          return '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700">Complete</span>';
        }
        return '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700">In Progress</span>';
      }

      function renderWeeks(weeks) {
        const container = document.getElementById('weeks-container');
        // Reverse chronological order
        const sorted = [...weeks].reverse();

        sorted.forEach(function (week) {
          const card = document.createElement('a');
          card.href = '/tasks/week-' + week.number + '/';
          card.id  = 'week-card-' + week.number;
          card.className = [
            'block bg-white border border-gray-200 rounded-xl p-5',
            'hover:shadow-md hover:border-indigo-200 transition-all duration-200 group'
          ].join(' ');

          card.innerHTML = `
            <div class="flex items-start justify-between gap-4">
              <div class="flex flex-col gap-1">
                <span class="text-xs font-semibold text-indigo-600 uppercase tracking-wide">Week ${week.number}</span>
                <span class="text-sm text-gray-700 font-medium">${week.date_range || '—'}</span>
                <span class="text-xs text-gray-400 mt-1">${week.meetings_processed ?? 0} meeting${week.meetings_processed !== 1 ? 's' : ''} processed</span>
              </div>
              <div class="flex-shrink-0 pt-0.5">
                ${statusBadge(week.status)}
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      }

      async function init() {
        try {
          const res  = await fetch('/data/weeks.json');
          const data = await res.json();

          document.getElementById('loading-state').classList.add('hidden');

          if (!data.weeks || data.weeks.length === 0) {
            document.getElementById('empty-state').classList.remove('hidden');
          } else {
            renderWeeks(data.weeks);
            document.getElementById('weeks-container').classList.remove('hidden');
          }
        } catch (err) {
          document.getElementById('loading-state').classList.add('hidden');
          document.getElementById('empty-state').classList.remove('hidden');
        }
      }

      init();
    })();
  </script>

</body>
</html>
