<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opencontroller demo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1d20'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='12' font-weight='700' fill='%23ededed' text-anchor='middle'%3Eoc%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="./app.css">
<script>
  // Visitors who have not signed in go back to the landing page's gate before anything draws.
  try { var s = JSON.parse(localStorage.getItem('ocdemo.session') || 'null'); if (!s || !s.email) location.replace('../?gate=1'); } catch (e) { /* storage blocked: main.mjs decides */ }
  try { var p = JSON.parse(localStorage.getItem('ocdemo.prefs') || '{}'); if (p.theme) document.documentElement.dataset.theme = p.theme; } catch (e) {}
</script>
</head>
<body>
<div id="app" class="app" hidden>
  <aside id="side" class="side"></aside>
  <div class="main">
    <div id="bar"></div>
    <main id="page" class="page" tabindex="-1"></main>
  </div>
  <div id="ctrl-slot"></div>
  <div id="explain-slot"></div>
  <div class="nav-scrim" data-act="mobile-nav"></div>
</div>
<noscript><p style="padding:24px;font-family:system-ui">The opencontroller demo needs JavaScript.</p></noscript>
<script type="module" src="./js/main.mjs"></script>
</body>
</html>
