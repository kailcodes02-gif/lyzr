<!-- Sign-in gate -->
<div id="gate" class="gate">
  <div class="gatecard">
    <svg class="logo" viewBox="2.449 0 198.551 34" style="height:22px"><use href="#lyzr-lockup"/></svg>
    <div class="seghead" style="margin:10px 0 0">GSI and SI programme</div>
    <h1>Campaign Analytics</h1>
    <p class="muted">Ads, email and HubSpot leads for the GSI and SI programme in one place. Sign in with your Lyzr Microsoft account.</p>
    <button id="msBtn" class="btn primary">Sign in with Microsoft</button>
    <button id="demoBtn" class="btn">Explore with sample data</button>
    <details id="localBox" style="margin-top:4px"><summary class="muted" style="cursor:pointer;font-size:13px">Or sign in with email and password</summary>
      <form id="localForm" style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
        <input type="email" id="localEmail" placeholder="Email" autocomplete="username" required>
        <input type="password" id="localPass" placeholder="Password" autocomplete="current-password" required>
        <button class="btn" type="submit" id="localBtn">Sign in</button>
      </form>
    </details>
    <p id="gerr" class="err"></p>
  </div>
</div>

<!-- App shell: sidebar + main -->
<div id="app" class="app hidden">
  <aside class="side" id="side">
    <div class="brandrow"><svg class="logo" viewBox="2.449 0 198.551 34" style="height:18px"><use href="#lyzr-lockup"/></svg></div>
    <div class="product">Campaign Analytics <span id="demoTag" class="tag hidden">sample data</span></div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="foot2">
      <div class="user"><span id="uav" class="avatar"></span><span id="uname" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span></div>
      <button id="signout" class="btn tiny ghost" style="margin-top:8px">Sign out</button>
    </div>
  </aside>
  <div class="mainwrap">
    <header class="topline">
      <span class="crumb" id="crumb"></span>
      <div class="range" id="rangeBox">
        <span class="ui-label">Dates</span>
        <select id="rangePreset" aria-label="Date range preset"></select>
        <input type="date" id="rangeFrom" aria-label="From">
        <span class="muted">to</span>
        <input type="date" id="rangeTo" aria-label="To">
        <span class="ui-label" style="margin-left:10px">Compare with</span>
        <select id="cmpMode" aria-label="Compare with"></select>
        <input type="number" id="cmpN" min="1" max="52" value="4" aria-label="How many" style="width:58px" class="hidden">
      </div>
      <span class="refreshbox"><span id="dataAt" class="muted" title="Pages keep their data for 8 hours while you switch tabs. Refresh to load the latest from the server. AI read-outs only run when you press Generate."></span><button id="hardRefresh" class="btn tiny" type="button" title="Reload every number on this page from the server">Refresh data</button></span>
    </header>
    <main id="main" class="main"></main>
    <footer class="foot" id="foot"></footer>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="./js/app.mjs"></script>
</body>
</html>
