<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lyzr Pipeline · Use Case Tracker</title>
<meta name="description" content="Lyzr internal pipeline and use-case tracker." />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>

<!-- Tailwind (precompiled — see rebuild-styles.sh to regenerate) -->
<link rel="stylesheet" href="styles.css" />

<!-- Alpine.js -->
<script defer src="https://unpkg.com/alpinejs@3.13.10/dist/cdn.min.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>

<!-- Google Identity Services (for @lyzr.ai OAuth) -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  :root {
    --bg: #190B04;
    --bgAlt: #0F0703;
    --inner: #1C0D06;
    --card: #211008;
    --rule: #2A1509;
    --rule2: #3A1E0C;
    --ink: #F5EDE3;
    --ink2: #C4AFA0;
    --ink3: #7A6358;
    --orange: #EC7943;
    --blue: #4A6EA8;
    --green: #378063;
    --purple: #7A629C;
    --gold: #CF9F31;
    --red: #C94658;
    --o-lt: rgba(236, 121, 67, 0.10);
    --o-bd: rgba(236, 121, 67, 0.30);
    --b-lt: rgba(74, 110, 168, 0.10);
    --b-bd: rgba(74, 110, 168, 0.30);
    --g-lt: rgba(55, 128, 99, 0.10);
    --g-bd: rgba(55, 128, 99, 0.30);
    --p-lt: rgba(122, 98, 156, 0.10);
    --p-bd: rgba(122, 98, 156, 0.30);
    --go-lt: rgba(207, 159, 49, 0.10);
    --go-bd: rgba(207, 159, 49, 0.30);
    --r-lt: rgba(201, 70, 88, 0.10);
    --r-bd: rgba(201, 70, 88, 0.30);
    /* Light mode fixes */
    --nav-bg: rgba(15, 7, 3, 0.85);
    --grid-line: rgba(255, 255, 255, 0.018);
    --ink-04: rgba(245, 237, 227, 0.04);
    --ink-06: rgba(245, 237, 227, 0.06);
    --ink-10: rgba(245, 237, 227, 0.10);
    --o-04: rgba(236, 121, 67, 0.04);
    --o-18: rgba(236, 121, 67, 0.18);
  }

  html[data-theme="light"] {
    --bg: #FAFAF8;
    --bgAlt: #F0F0EB;
    --inner: #FFFFFF;
    --card: #FDFDFB;
    --rule: #EAE6DF;
    --rule2: #D8D2CA;
    --ink: #190B04;
    --ink2: #5C4D43;
    --ink3: #8C7B71;
    --orange: #D95D22;
    --blue: #3A5A8E;
    --green: #2B6B50;
    --purple: #624B84;
    --gold: #B5861F;
    --red: #B33446;
    --o-lt: rgba(217, 93, 34, 0.10);
    --o-bd: rgba(217, 93, 34, 0.30);
    --b-lt: rgba(58, 90, 142, 0.10);
    --b-bd: rgba(58, 90, 142, 0.30);
    --g-lt: rgba(43, 107, 80, 0.10);
    --g-bd: rgba(43, 107, 80, 0.30);
    --p-lt: rgba(98, 75, 132, 0.10);
    --p-bd: rgba(98, 75, 132, 0.30);
    --go-lt: rgba(181, 134, 31, 0.10);
    --go-bd: rgba(181, 134, 31, 0.30);
    --r-lt: rgba(179, 52, 70, 0.10);
    --r-bd: rgba(179, 52, 70, 0.30);
    /* Light mode fixes */
    --nav-bg: rgba(240, 240, 235, 0.85);
    --grid-line: rgba(0, 0, 0, 0.03);
    --ink-04: rgba(25, 11, 4, 0.04);
    --ink-06: rgba(25, 11, 4, 0.06);
    --ink-10: rgba(25, 11, 4, 0.10);
    --o-04: rgba(217, 93, 34, 0.04);
    --o-18: rgba(217, 93, 34, 0.18);
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    background-image:
      radial-gradient(1200px 600px at 80% -10%, rgba(236, 121, 67, 0.08), transparent 60%),
      radial-gradient(900px 500px at -10% 30%, rgba(74, 110, 168, 0.05), transparent 60%);
  }

  /* Subtle grid texture on the body */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  .serif { font-family: 'Playfair Display', Georgia, serif; }
  .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* Stage chips */
  .chip-stage {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: capitalize;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .chip-stage::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: currentColor;
  }
  .stage-demo            { background: var(--b-lt);  border-color: var(--b-bd);  color: var(--blue); }
  .stage-in-conversation { background: var(--o-lt);  border-color: var(--o-bd);  color: var(--orange); }
  .stage-customer        { background: var(--g-lt);  border-color: var(--g-bd);  color: var(--green); }
  .stage-win             { background: var(--go-lt); border-color: var(--go-bd); color: var(--gold); }
  .stage-lost            { background: var(--r-lt);  border-color: var(--r-bd);  color: var(--red); }
  .stage-unspecified     { background: var(--p-lt); border-color: var(--p-bd); color: var(--purple); }

  /* Owner pills */
  .pill-owner {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    background: var(--ink-04);
    border: 1px solid var(--ink-10);
    color: var(--ink);
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease;
    white-space: nowrap;
    line-height: 1.2;
  }
  .pill-owner:hover {
    background: var(--o-lt);
    border-color: var(--o-bd);
    color: var(--orange);
  }
  .pill-owner .dot {
    width: 5px;
    height: 5px;
    border-radius: 999px;
    background: var(--orange);
    flex: 0 0 5px;
  }

  /* Quiet pill (category, industry) */
  .pill-quiet {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    background: var(--ink-04);
    color: var(--ink2);
    border: 1px solid var(--ink-06);
    white-space: nowrap;
  }

  /* Cards */
  .card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 12px;
  }
  .card-inner {
    background: var(--inner);
    border: 1px solid var(--rule);
    border-radius: 10px;
  }

  /* Big number style */
  .big-num {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: -0.02em;
  }

  /* KPI label */
  .kpi-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink3);
  }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bgAlt); }
  ::-webkit-scrollbar-thumb { background: var(--rule2); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink3); }

  /* Inputs */
  .input {
    background: var(--inner);
    border: 1px solid var(--rule);
    color: var(--ink);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    width: 100%;
    transition: border-color 120ms;
  }
  .input:focus { outline: none; border-color: var(--orange); }

  /* Tab nav */
  .tab {
    position: relative;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink2);
    cursor: pointer;
    transition: color 120ms;
    border-radius: 6px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active {
    color: var(--orange);
    background: var(--o-lt);
  }
  .tab .badge {
    margin-left: 6px;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--ink-06);
    color: var(--ink3);
  }
  .tab.active .badge {
    background: var(--o-18);
    color: var(--orange);
  }

  /* Filter row */
  .filter-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 8px;
    display: block;
  }
  .check-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink2);
    transition: background 120ms;
  }
  .check-row:hover { background: var(--ink-04); color: var(--ink); }
  .check-row input { accent-color: var(--orange); cursor: pointer; }
  .check-row .count {
    margin-left: auto;
    font-size: 11px;
    color: var(--ink3);
    font-variant-numeric: tabular-nums;
  }

  /* Quick view chips */
  .qv-chip {
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink2);
    background: var(--card);
    border: 1px solid var(--rule);
    cursor: pointer;
    transition: all 120ms;
    white-space: nowrap;
  }
  .qv-chip:hover { color: var(--ink); border-color: var(--rule2); }
  .qv-chip.active {
    color: var(--orange);
    background: var(--o-lt);
    border-color: var(--o-bd);
  }
  .qv-chip[disabled] {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .qv-chip[disabled]:hover { color: var(--ink2); border-color: var(--rule); }

  /* Table */
  table.deals { width: 100%; border-collapse: separate; border-spacing: 0; }
  table.deals th {
    text-align: left;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink3);
    padding: 12px 10px;
    background: var(--inner);
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 0;
    z-index: 2;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  table.deals th:hover { color: var(--ink); }
  table.deals th .sort-arrow { opacity: 0.4; margin-left: 4px; }
  table.deals th.sorted .sort-arrow { opacity: 1; color: var(--orange); }

  table.deals td {
    padding: 12px 10px;
    border-bottom: 1px solid var(--rule);
    font-size: 13px;
    color: var(--ink2);
    vertical-align: top;
  }
  table.deals tbody tr {
    cursor: pointer;
    transition: background 120ms;
  }
  table.deals tbody tr:hover { background: var(--o-04); }
  table.deals tbody tr td:first-child { color: var(--ink3); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  table.deals .col-company { color: var(--ink); font-weight: 500; }
  table.deals .col-project { color: var(--ink); }
  table.deals .col-acv { font-variant-numeric: tabular-nums; font-weight: 500; color: var(--ink); }

  /* Drawer */
  .drawer-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 50;
  }
  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 100%; max-width: 640px;
    background: var(--bg);
    border-left: 1px solid var(--rule2);
    z-index: 51;
    overflow-y: auto;
    box-shadow: -20px 0 60px rgba(0,0,0,0.5);
  }

  /* Pill button (links) */
  .btn-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 6px;
    background: var(--o-lt);
    border: 1px solid var(--o-bd);
    color: var(--orange);
    font-size: 11px;
    font-weight: 600;
    text-decoration: none;
    transition: all 120ms;
    white-space: nowrap;
  }
  .btn-link:hover { background: var(--orange); color: var(--bg); }

  /* Auth gate */
  .auth-bg {
    background:
      radial-gradient(800px 600px at 70% 30%, rgba(236, 121, 67, 0.12), transparent 60%),
      radial-gradient(600px 500px at 20% 70%, rgba(74, 110, 168, 0.08), transparent 60%),
      var(--bg);
    min-height: 100vh;
  }

  /* Funnel bars */
  .funnel-row { display: grid; grid-template-columns: 110px 1fr 80px 90px; align-items: center; gap: 16px; padding: 10px 0; }
  .funnel-bar { height: 28px; border-radius: 4px; }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .anim-fadeup { animation: fadeUp 400ms ease-out backwards; }

  /* Hide alpine cloak before hydration */
  [x-cloak] { display: none !important; }

  /* Loading dot pulse */
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .pulse-dot { animation: pulse-dot 1.4s ease-in-out infinite; }
</style>
</head>

<body class="font-sans">

<!-- ============================================================
     ROOT APP
============================================================ -->
<div x-data="lyzrApp()" x-init="init()" x-cloak class="relative" style="z-index: 1;"
     @keydown.escape.window="selectedRow = null">

  <!-- ============================================================
       AUTH GATE  (stub — wire OAuth Client ID later)
  ============================================================ -->
  <template x-if="!authed">
    <div class="auth-bg flex items-center justify-center px-6">
      <div class="card max-w-md w-full p-10 anim-fadeup" style="animation-delay: 100ms;">

        <!-- Lyzr wordmark -->
        <div class="flex items-center gap-3 mb-10">
          <div class="w-9 h-9 rounded-lg flex items-center justify-center"
               style="background: linear-gradient(135deg, var(--orange), #c25e2c);">
            <span class="serif text-bg text-xl font-bold leading-none">L</span>
          </div>
          <div>
            <div class="serif text-xl font-bold">Lyzr</div>
            <div class="text-xs uppercase tracking-[2px] text-ink3">Pipeline · Use Cases</div>
          </div>
        </div>

        <h1 class="serif text-3xl font-bold mb-3 leading-tight">
          Sign in to view <em class="text-orange not-italic">the pipeline</em>.
        </h1>
        <p class="text-ink2 text-sm leading-relaxed mb-8">
          Restricted to Lyzr employees. Use your <span class="text-ink">@lyzr.ai</span> Google account.
        </p>

        <!-- Google sign-in button (stubbed) -->
        <button
          @click="googleSignIn()"
          class="w-full flex items-center justify-center gap-3 px-5 py-3 rounded-lg
                 bg-white text-bg font-medium text-sm
                 hover:bg-ink transition"
        >
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <g fill="none" fill-rule="evenodd">
              <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
              <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
              <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
              <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
            </g>
          </svg>
          <span>Continue with Google</span>
        </button>



      </div>
    </div>
  </template>


  <!-- ============================================================
       MAIN APP SHELL  (after auth)
  ============================================================ -->
  <template x-if="authed">
    <div class="min-h-screen flex flex-col">

      <header class="sticky top-0 z-30 backdrop-blur-md"
              style="background: var(--nav-bg); border-bottom: 1px solid var(--rule);">
        <div class="max-w-[1600px] mx-auto px-6 h-16 flex items-center gap-8">

          <!-- Logo -->
          <button @click="setView('home')" class="flex items-center gap-2.5 group">
            <div class="w-8 h-8 rounded-md flex items-center justify-center transition"
                 style="background: linear-gradient(135deg, var(--orange), #c25e2c);">
              <span class="serif text-bg text-base font-bold leading-none">L</span>
            </div>
            <div class="leading-tight">
              <div class="serif text-base font-bold group-hover:text-orange transition">Pipeline</div>
              <div class="text-[9px] uppercase tracking-[2px] text-ink3">Use Case Tracker</div>
            </div>
          </button>

          <!-- Tabs -->
          <nav class="flex items-center gap-1 flex-1">
            <button class="tab" :class="view==='home' && 'active'" @click="setView('home')">Home</button>
            <button class="tab" :class="view==='Internal' && 'active'" @click="setView('Internal')">
              Internal <span class="badge" x-text="count('Internal')"></span>
            </button>
            <button class="tab" :class="view==='Accenture' && 'active'" @click="setView('Accenture')">
              Accenture <span class="badge" x-text="count('Accenture')"></span>
            </button>
            <button class="tab" :class="view==='GSI-SI' && 'active'" @click="setView('GSI-SI')">
              GSI/SI <span class="badge" x-text="count('GSI-SI')"></span>
            </button>
            <button class="tab" :class="view==='Enterprises' && 'active'" @click="setView('Enterprises')">
              Enterprises <span class="badge" x-text="count('Enterprises')"></span>
            </button>
          </nav>

          <!-- Right side: data freshness + user -->
          <div class="flex items-center gap-4">
            <div class="text-right leading-tight hidden md:block">
              <div class="text-[10px] uppercase tracking-[1.5px] text-ink3">Last sync</div>
              <div class="text-xs text-ink2 mono" x-text="formatGenerated()"></div>
            </div>

            <!-- Theme toggle -->
            <button @click="theme = theme === 'dark' ? 'light' : 'dark'" class="text-ink3 hover:text-orange transition ml-2" title="Toggle theme">
              <svg x-show="theme === 'dark'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="opacity-80 hover:opacity-100 transition">
                <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
              </svg>
              <svg x-show="theme === 'light'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" x-cloak class="opacity-80 hover:opacity-100 transition">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
            </button>
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg"
                 style="background: var(--inner); border: 1px solid var(--rule);">
              <div class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold"
                   style="background: var(--o-lt); color: var(--orange); border: 1px solid var(--o-bd);">
                <span x-text="userInitial()"></span>
              </div>
              <span class="text-xs text-ink2" x-text="userLabel()"></span>
              <button @click="signOut()" class="text-ink3 hover:text-red transition ml-1" title="Sign out">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </header>


      <!-- ===== LOADING ===== -->
      <template x-if="loading">
        <div class="flex-1 flex items-center justify-center py-32">
          <div class="text-center">
            <div class="flex items-center justify-center gap-2 mb-3">
              <div class="w-2 h-2 rounded-full bg-orange pulse-dot" style="animation-delay: 0ms;"></div>
              <div class="w-2 h-2 rounded-full bg-orange pulse-dot" style="animation-delay: 200ms;"></div>
              <div class="w-2 h-2 rounded-full bg-orange pulse-dot" style="animation-delay: 400ms;"></div>
            </div>
            <div class="text-xs text-ink3 uppercase tracking-[2px]">Loading pipeline</div>
          </div>
        </div>
      </template>


      <!-- ===== HOME VIEW ===== -->
      <template x-if="!loading && view === 'home'">
        <main class="flex-1 max-w-[1600px] mx-auto px-6 py-10 w-full">

          <!-- Greeting block -->
          <div class="anim-fadeup mb-12" style="animation-delay: 50ms;">
            <div class="text-[11px] uppercase tracking-[3px] text-orange mb-3">Pipeline · Pulse</div>
            <h1 class="serif text-5xl md:text-6xl font-bold leading-[0.95] mb-4">
              <span x-text="data.aggregates.total_rows"></span> use cases.
              <em class="not-italic text-orange"
                  x-text="formatMoneyShort(data.aggregates.total_acv)"></em> in motion.

                     x-text="selectedRow.time_period || 'Time period not specified'"></div>

              <div class="card-inner p-4">
                <div class="kpi-label mb-2">Expected close</div>
                <div class="text-base text-ink font-medium" x-text="selectedRow.close_date_raw || '—'"></div>
                <div class="text-[10px] text-ink3 mt-1 mono"
                     x-text="selectedRow.close_quarter && selectedRow.close_quarter !== selectedRow.close_date_raw ? selectedRow.close_quarter : ''"></div>
              </div>
            </div>

            <!-- Owners -->
            <div class="grid grid-cols-2 gap-3 mb-6">
              <div class="card-inner p-4">
                <div class="kpi-label mb-2.5">Opportunity owner</div>
                <div class="flex flex-wrap gap-1.5" x-show="selectedRow.opportunity_owners.length">
                  <template x-for="o in selectedRow.opportunity_owners" :key="o">
                    <span class="pill-owner"><span class="dot"></span><span x-text="o"></span></span>
                  </template>
                </div>
                <span x-show="!selectedRow.opportunity_owners.length" class="text-ink3 text-sm">Unassigned</span>
              </div>
              <div class="card-inner p-4">
                <div class="kpi-label mb-2.5">Prototype owner</div>
                <div class="flex flex-wrap gap-1.5" x-show="selectedRow.prototype_owners.length">
                  <template x-for="o in selectedRow.prototype_owners" :key="o">
                    <span class="pill-owner"><span class="dot"></span><span x-text="o"></span></span>
                  </template>
                </div>
                <span x-show="!selectedRow.prototype_owners.length" class="text-ink3 text-sm">Unassigned</span>
              </div>
            </div>

            <!-- Prototype link CTA -->
            <a x-show="selectedRow.prototype_link"
               :href="selectedRow.prototype_link"
               target="_blank" rel="noopener noreferrer"
               class="block w-full text-center py-3 rounded-lg font-medium mb-6 transition"
               style="background: var(--orange); color: var(--bg);">
              Open prototype →
            </a>

            <!-- Meta -->
            <div class="card-inner p-4 text-xs text-ink3 leading-relaxed">
              <div class="flex justify-between mb-1.5">
                <span>Row ID</span>
                <span class="mono text-ink2" x-text="selectedRow.id"></span>
              </div>
              <div class="flex justify-between mb-1.5">
                <span>Segment</span>
                <span class="text-ink2" x-text="selectedRow.segment"></span>
              </div>
              <div class="flex justify-between">
                <span>Source row</span>
                <span class="mono text-ink2" x-text="`#${selectedRow.sn}`"></span>
              </div>
            </div>

          </aside>
        </div>
      </template>

    </div>
  </template>
</div>


<!-- ============================================================
     APP LOGIC
============================================================ -->
<script>
// =============================================================================
// CONFIG — Lyzr OAuth Client ID
// =============================================================================
// To enable real Google sign-in:
//   1. Create an OAuth Client ID in Google Cloud Console (see README).
//   2. Replace the placeholder string below with your Client ID.
//   3. Authorized JavaScript origins MUST include https://lyzr.kailash-gm.com
//      (and http://localhost:8765 if you want to test locally).
//
// While this is the placeholder, the "Continue with Google" button will show
// a friendly error.
// =============================================================================
const LYZR_OAUTH_CLIENT_ID = '393767244875-e2n5j0jr90g0a8asp4ti9akmlern6enb.apps.googleusercontent.com';

function lyzrApp() {
  return {
    // --- theme ---
    theme: 'dark',

    // --- auth ----
    authed: false,
    user: { name: 'Dev User', email: 'dev@lyzr.ai' },

    // --- data ----
    loading: true,
    data: { rows: [], aggregates: {}, facets: {} },

    // --- view ---
    view: 'home',

    // --- segment filters ---
    search: '',
    quickView: 'all',
    filters: {
      stages: [],
      categories: [],
      industries: [],
      oppOwners: [],
      protoOwners: [],
      acvBucket: 'any',
    },
    sort: { key: 'acv', dir: 'desc' },
    selectedRow: null,
    acvBuckets: [
      { id: 'any',    label: 'Any' },
      { id: 'has',    label: 'Any with ACV' },
      { id: 'none',   label: 'No ACV recorded' },
      { id: 'lt50',   label: 'Under $50K' },
      { id: '50_250', label: '$50K – $250K' },
      { id: '250_1M', label: '$250K – $1M' },
      { id: 'gt1M',   label: '$1M and up' },
    ],

    // ---------- INIT ----------
    async init() {
      // Restore theme
      this.theme = localStorage.getItem('lyzr.theme') || 'dark';
      document.documentElement.setAttribute('data-theme', this.theme);
      this.$watch('theme', val => {
        document.documentElement.setAttribute('data-theme', val);
        localStorage.setItem('lyzr.theme', val);
      });

      // Restore auth from sessionStorage if present
      const stored = sessionStorage.getItem('lyzr.user');
      if (stored) {
        try {
          this.user = JSON.parse(stored);
          this.authed = true;
        } catch(e) {}
      }

      try {
        const r = await fetch('data.json', { cache: 'no-store' });
        this.data = await r.json();
      } catch (err) {
        console.error('Failed to load data.json', err);
      }
      this.loading = false;
    },

    // ---------- AUTH ----------
    // Real Google Identity Services flow.
    //
    // The @lyzr.ai restriction is enforced by the `hd` claim on the returned
    // ID token — that claim is only present for Google Workspace accounts,
    // and only equals 'lyzr.ai' for verified @lyzr.ai users. Personal Gmail
    // accounts have no `hd` claim and are rejected. Other Workspace accounts
    // have a different `hd` and are also rejected.
    //
    // This works regardless of whether the OAuth project lives under a
    // personal Gmail or under the Lyzr Workspace.
    googleSignIn() {
      // Guard 1: GIS script not loaded yet.
      if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
        alert('Google sign-in is still loading. Wait a second and try again.');
        return;
      }
      // Guard 2: Client ID hasn't been provisioned yet.
      if (!LYZR_OAUTH_CLIENT_ID || LYZR_OAUTH_CLIENT_ID.startsWith('REPLACE_')) {
        alert(
          'OAuth Client ID is not configured yet.\n\n' +
          'See README → "Wiring Google OAuth" for the 5-minute setup, then ' +
          'paste the Client ID into LYZR_OAUTH_CLIENT_ID at the top of index.html.'
        );
        return;
      }

      // Use the OAuth2 Token Client which allows opening a popup from a custom button click
      const client = google.accounts.oauth2.initTokenClient({
        client_id: LYZR_OAUTH_CLIENT_ID,
        scope: 'email profile',
        hd: 'lyzr.ai',
        callback: async (response) => {
          if (response.error) {
            console.error('OAuth error:', response);
            return;
          }
          
          try {
            // Fetch user info using the access token
            const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
              headers: { Authorization: `Bearer ${response.access_token}` }
            });
            const payload = await res.json();

            // The hard wall.
            if (payload.hd !== 'lyzr.ai' || !payload.email_verified) {
              alert(
                'Access restricted to verified @lyzr.ai accounts.\n\n' +
                (payload.email
                  ? `You signed in with: ${payload.email}`
                  : 'No verified Lyzr Workspace account was found on the token.')
              );
              return;
            }

            this.user = {
              name: payload.name,
              email: payload.email,
              picture: payload.picture,
            };
            this.authed = true;
            sessionStorage.setItem('lyzr.user', JSON.stringify(this.user));
          } catch (err) {
            console.error('Auth error:', err);
            alert('Sign-in failed. Open DevTools console for details.');
          }
        },
      });

      // Request the access token, this opens the Google sign-in popup
      client.requestAccessToken();
    },

    signOut() {
      sessionStorage.removeItem('lyzr.user');
      this.authed = false;
    },
    userInitial() {
      return (this.user.name || this.user.email || '?').charAt(0).toUpperCase();
    },
    userLabel() {
      return this.user.name || this.user.email || 'Signed in';
    },

    // ---------- VIEW SWITCHING ----------
    setView(v) {
      this.view = v;
      this.selectedRow = null;
      this.search = '';
      this.quickView = 'all';
      this.clearFilters();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    count(seg) {
      if (!this.data.rows) return 0;
      return this.data.rows.filter(r => r.segment === seg).length;
    },

    // ---------- FORMATTING ----------
    formatMoneyShort(n) {
      if (!n) return '$0';
      if (n >= 1_000_000) return `$${(n/1_000_000).toFixed(n >= 10_000_000 ? 1 : 2).replace(/\.?0+$/,'')}M`;
      if (n >= 1_000) return `$${(n/1_000).toFixed(0)}K`;
      return `$${n.toFixed(0)}`;
    },
    formatGenerated() {
      if (!this.data.generated_at) return '—';
      const d = new Date(this.data.generated_at);
      return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    },
    pct(part, total) {
      if (!total) return 0;
      return Math.max(0, Math.min(100, (part / total) * 100));
    },

    // ---------- HOME-PAGE HELPERS ----------
    stageColor(stage) {
      return ({
        'Demo': '#4A6EA8',
        'in-conversation': '#EC7943',
        'win': '#CF9F31',
        'customer': '#378063',
        'lost': '#C94658',
      })[stage] || '#7A629C';
    },
    segStageCount(seg, stage) {
      return this.data.aggregates.by_segment?.[seg]?.stages?.[stage] || 0;
    },
    segStagePct(seg, stage) {
      const total = this.data.aggregates.by_segment?.[seg]?.count || 0;
      if (!total) return 0;
      return (this.segStageCount(seg, stage) / total) * 100;
    },

    // ---------- SEGMENT-VIEW HELPERS ----------
    get segmentRows() {
      return this.data.rows.filter(r => r.segment === this.view);
    },
    segmentCategories() {
      return [...new Set(this.segmentRows.map(r => r.category).filter(Boolean))].sort();
    },
    segmentIndustries() {
      return [...new Set(this.segmentRows.map(r => r.industry).filter(Boolean))].sort();
    },
    segmentOppOwners() {
      const s = new Set();
      this.segmentRows.forEach(r => r.opportunity_owners.forEach(o => s.add(o)));
      return [...s].sort();
    },
    segmentProtoOwners() {
      const s = new Set();
      this.segmentRows.forEach(r => r.prototype_owners.forEach(o => s.add(o)));
      return [...s].sort();
    },
    segmentStageCount(stage) {
      return this.segmentRows.filter(r => r.stage === stage).length;
    },
    stageInFilteredCount(stage) {
      return this.filtered.filter(r => r.stage === stage).length;
    },
    segmentSubtitle(seg) {
      return ({
        'Internal': 'Lyzr-built use cases — internal demos, agents, and prototypes that power our own ops and sales conversations.',
        'Accenture': 'The Accenture book of business — the GSI flagship partnership, including Accenture Song channel-routed deals.',
        'GSI-SI': 'Other GSIs and SIs — Capgemini, Deloitte, KPMG, Persistent, Movate, Publicis, and the broader partner bench.',
        'Enterprises': 'Direct enterprise opportunities, prototypes built for net-new accounts, and pipeline outside the GSI motion.',
      })[seg] || '';
    },

    // ---------- FILTERING ----------
    setQuickView(qv) {
      this.quickView = qv;
      // Quick views drive predicates in matchesFilters(); we only set explicit
      // filter state for views that map cleanly to a stage selection.
      if (qv === 'all') {
        this.filters.stages = [];
        this.filters.acvBucket = 'any';
      } else if (qv === 'wins') {
        this.filters.stages = ['win', 'customer'];
        this.filters.acvBucket = 'any';
      } else if (qv === 'lost') {
        this.filters.stages = ['lost'];
        this.filters.acvBucket = 'any';
      } else if (qv === 'hot') {
        // Stage + ACV floor handled in matchesFilters predicate (>= $100K)
        this.filters.stages = [];
        this.filters.acvBucket = 'any';
      } else if (qv === 'no-owner' || qv === 'has-prototype') {
        this.filters.stages = [];
        this.filters.acvBucket = 'any';
      }
    },
    hasActiveFilters() {
      return this.filters.stages.length || this.filters.categories.length ||
             this.filters.industries.length || this.filters.oppOwners.length ||
             this.filters.protoOwners.length || this.filters.acvBucket !== 'any' ||
             this.search.length > 0 || this.quickView !== 'all';
    },
    clearFilters() {
      this.filters = {
        stages: [], categories: [], industries: [],
        oppOwners: [], protoOwners: [], acvBucket: 'any',
      };
      this.search = '';
      this.quickView = 'all';
    },

    matchesFilters(row) {
      // Quick view overrides — these are computed predicates not filter state
      if (this.quickView === 'hot') {
        if (row.stage !== 'in-conversation') return false;
        if (!row.acv || row.acv < 100000) return false;
      }
      if (this.quickView === 'wins') {
        if (row.stage !== 'win' && row.stage !== 'customer') return false;
      }
      if (this.quickView === 'lost') {
        if (row.stage !== 'lost') return false;
      }
      if (this.quickView === 'no-owner') {
        if (row.opportunity_owners.length > 0) return false;
      }
      if (this.quickView === 'has-prototype') {
        if (!row.prototype_link) return false;
      }

      // Stage
      if (this.filters.stages.length && !this.filters.stages.includes(row.stage)) return false;
      // Category
      if (this.filters.categories.length && !this.filters.categories.includes(row.category)) return false;
      // Industry
      if (this.filters.industries.length && !this.filters.industries.includes(row.industry)) return false;
      // Opp owner
      if (this.filters.oppOwners.length &&
          !row.opportunity_owners.some(o => this.filters.oppOwners.includes(o))) return false;
      // Proto owner
      if (this.filters.protoOwners.length &&
          !row.prototype_owners.some(o => this.filters.protoOwners.includes(o))) return false;

      // ACV bucket
      const a = row.acv;
      const b = this.filters.acvBucket;
      if (b === 'has' && !a) return false;
      if (b === 'none' && a) return false;
      if (b === 'lt50' && (!a || a >= 50000)) return false;
      if (b === '50_250' && (!a || a < 50000 || a >= 250000)) return false;
      if (b === '250_1M' && (!a || a < 250000 || a >= 1000000)) return false;
      if (b === 'gt1M' && (!a || a < 1000000)) return false;

      // Search
      if (this.search) {
        const q = this.search.toLowerCase();
        const haystack = [
          row.company, row.project, row.use_case, row.industry,
          ...row.opportunity_owners, ...row.prototype_owners,
        ].filter(Boolean).join(' ').toLowerCase();
        if (!haystack.includes(q)) return false;
      }

      return true;
    },

    get filtered() {
      const list = this.segmentRows.filter(r => this.matchesFilters(r));
      const { key, dir } = this.sort;
      const sign = dir === 'asc' ? 1 : -1;
      return [...list].sort((a, b) => {
        const av = a[key], bv = b[key];
        if (av == null && bv == null) return 0;
        if (av == null) return 1; // nulls always last
        if (bv == null) return -1;
        if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sign;
        return String(av).localeCompare(String(bv)) * sign;
      });
    },
    get filteredAcv() {
      return this.filtered.reduce((s, r) => s + (r.acv || 0), 0);
    },

    // ---------- SORT ----------
    sortBy(key) {
      if (this.sort.key === key) {
        this.sort.dir = this.sort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        this.sort.key = key;
        this.sort.dir = (key === 'acv' || key === 'sn') ? 'desc' : 'asc';
      }
    },
    sortArrow(key) {
      if (this.sort.key !== key) return '↕';
      return this.sort.dir === 'asc' ? '↑' : '↓';
    },

    // ---------- ROW DETAIL ----------
    openRow(row) { this.selectedRow = row; },

    // ---------- CSV EXPORT ----------
    exportCsv() {
      const cols = [
        ['Sn', r => r.sn],
        ['Segment', r => r.segment],
        ['Company', r => r.company],
        ['Project', r => r.project],
        ['Industry', r => r.industry],
        ['Stage', r => r.stage],
        ['Category', r => r.category],
        ['ACV', r => r.acv],
        ['Opportunity Owners', r => r.opportunity_owners.join(' | ')],
        ['Prototype Owners', r => r.prototype_owners.join(' | ')],
        ['Prototype Link', r => r.prototype_link],
        ['Time Period', r => r.time_period],
        ['Close Date (Raw)', r => r.close_date_raw],
        ['Close Quarter', r => r.close_quarter],
        ['Use Case', r => r.use_case],
      ];
      const esc = v => {
        if (v == null) return '';
        const s = String(v);
        return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
      };
      const lines = [cols.map(c => c[0]).join(',')];
      this.filtered.forEach(r => lines.push(cols.map(c => esc(c[1](r))).join(',')));
      const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `lyzr-pipeline-${this.view}-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    },
  };
}
</script>
