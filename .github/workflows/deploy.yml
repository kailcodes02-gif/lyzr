name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=lyzr-work-os

      - name: Set environment variables on Cloudflare Pages
        run: |
          echo "kailcodes02-gif" | npx wrangler pages secret put GITHUB_OWNER --project-name=lyzr-work-os
          echo "lyzr" | npx wrangler pages secret put GITHUB_REPO --project-name=lyzr-work-os
          echo "pipeline/data.json" | npx wrangler pages secret put GITHUB_PATH --project-name=lyzr-work-os
          echo "main" | npx wrangler pages secret put GITHUB_BRANCH --project-name=lyzr-work-os
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set GITHUB_TOKEN (using GH_PAT) on Pages
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: ${{ env.GH_PAT != '' }}
        run: echo "${{ secrets.GH_PAT }}" | npx wrangler pages secret put GITHUB_TOKEN --project-name=lyzr-work-os

      - name: Set GITHUB_TOKEN (using PERSONAL_ACCESS_TOKEN) on Pages
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: ${{ env.PERSONAL_ACCESS_TOKEN != '' }}
        run: echo "${{ secrets.PERSONAL_ACCESS_TOKEN }}" | npx wrangler pages secret put GITHUB_TOKEN --project-name=lyzr-work-os

      - name: Set GITHUB_TOKEN (using PAT) on Pages
        env:
          PAT: ${{ secrets.PAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: ${{ env.PAT != '' }}
        run: echo "${{ secrets.PAT }}" | npx wrangler pages secret put GITHUB_TOKEN --project-name=lyzr-work-os
