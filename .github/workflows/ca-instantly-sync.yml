name: Campaign Analytics · Instantly daily pull

# Pulls every GSI-tagged Instantly campaign (totals + daily breakdown) into the
# Campaign Analytics database, read-only against Instantly. The work happens in
# the Pages Function /api/ca/instantly/sync, which is resumable: this job keeps
# calling it with the returned cursor until it answers done:true.
#
# Needs the same secret in two places:
#   GitHub Actions secret  CA_CRON_SECRET
#   Pages secret           CA_CRON_SECRET   (npx wrangler pages secret put CA_CRON_SECRET --project-name lyzr-work-os)
on:
  schedule:
    # 07:00 IST every day (= 01:30 UTC)
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Pull each campaign's whole history (true) instead of the last 30 days"
        default: "false"
        required: false

concurrency:
  group: ca-instantly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      URL: https://lyzr.kailash-gm.com/api/ca/instantly/sync
      CA_CRON_SECRET: ${{ secrets.CA_CRON_SECRET }}
      FULL: ${{ inputs.full || 'false' }}
    steps:
      - name: Pull GSI campaigns from Instantly
        run: |
          set -euo pipefail
          if [ -z "${CA_CRON_SECRET}" ]; then echo "CA_CRON_SECRET is not set"; exit 1; fi
          body=$(jq -nc --argjson full "${FULL}" '{full:$full}')
          for i in $(seq 1 60); do
            res=$(curl -sS --fail-with-body -X POST "$URL" \
              -H "Content-Type: application/json" -H "X-CA-Cron: ${CA_CRON_SECRET}" \
              --data "$body")
            echo "$res" | jq -c '{done, campaigns, days, progress, warnings}'
            if [ "$(echo "$res" | jq -r '.done')" = "true" ]; then exit 0; fi
            body=$(echo "$res" | jq -c '{cursor: .cursor}')
          done
          echo "Sync did not finish in 60 calls"; exit 1
